[tool.poetry]
name = "energymanagementrl"
version = "0.2.0"
description = "RL-based solar+battery energy management system"
authors = ["emanuele <emanuele.rapisarda.1997@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
numpy = ">=2.0.2"
pandas = ">=2.2.3"
gymnasium = ">=0.29.1"
stable-baselines3 = ">=2.5.0a0"
scipy = ">=1.14.1"
openmeteo-requests = ">=1.3.0"
requests-cache = ">=1.2.1"
pvlib = ">=0.11.1"
fusion-solar-py = ">=0.1.2"
torch = ">=2.5.1"
requests = ">=2.32.3"
python-telegram-bot = ">=21.10"
tornado = ">=6.4.1"
pytz = ">=2024.1"
python-dotenv = ">=1.0.0"
matplotlib = ">=3.9.3"

[tool.poetry.extras]
kaggle = ["kaggle"]
dev = ["pytest", "pytest-mock", "pytest-cov"]

[tool.poetry.scripts]
empipeline = "energymanagementrl.pipeline.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
